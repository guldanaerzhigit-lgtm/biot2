<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по БиОТ — 105 вопросов</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;color:#e0e0e0;display:flex;justify-content:center;align-items:center;padding:20px}
  .container{background:rgba(255,255,255,0.07);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.12);border-radius:20px;max-width:800px;width:100%;padding:40px;box-shadow:0 25px 50px rgba(0,0,0,0.4)}
  h1{text-align:center;font-size:28px;margin-bottom:8px;color:#fff;font-weight:600}
  h2{text-align:center;font-size:16px;color:#a0aec0;margin-bottom:30px;font-weight:400}
  .screen{display:none}
  .screen.active{display:block}
  .login-form{margin-top:20px}
  .form-group{margin-bottom:24px}
  .form-group label{display:block;margin-bottom:8px;font-size:15px;color:#cbd5e0;font-weight:500}
  .form-group input{width:100%;padding:14px 18px;border:1px solid rgba(255,255,255,0.15);border-radius:12px;background:rgba(0,0,0,0.25);color:#fff;font-size:16px;outline:none;transition:all 0.3s}
  .form-group input:focus{border-color:#4fd1c5;box-shadow:0 0 0 3px rgba(79,209,197,0.15)}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 32px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.3s;text-decoration:none}
  .btn-primary{background:linear-gradient(135deg,#4fd1c5,#319795);color:#fff;width:100%}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(79,209,197,0.35)}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-secondary{background:rgba(255,255,255,0.1);color:#e0e0e0;border:1px solid rgba(255,255,255,0.15)}
  .btn-secondary:hover{background:rgba(255,255,255,0.18)}
  .lang-switch{display:flex;justify-content:center;gap:8px;margin-bottom:20px}
  .lang-btn{padding:6px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#a0aec0;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
  .lang-btn.active{background:linear-gradient(135deg,#4fd1c5,#319795);color:#fff;border-color:transparent}
  .progress-bar{height:6px;background:rgba(255,255,255,0.08);border-radius:3px;margin-bottom:24px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,#4fd1c5,#319795);border-radius:3px;transition:width 0.4s ease}
  .question-counter{text-align:center;font-size:14px;color:#a0aec0;margin-bottom:20px}
  .question-text{font-size:18px;line-height:1.6;color:#fff;margin-bottom:28px;padding:20px;background:rgba(0,0,0,0.2);border-radius:14px;border-left:4px solid #4fd1c5}
  .answers{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
  .answer-option{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;background:rgba(255,255,255,0.05);border:2px solid rgba(255,255,255,0.08);border-radius:14px;cursor:pointer;transition:all 0.25s;text-align:left;width:100%;color:#e0e0e0;font-size:16px;line-height:1.5;font-family:inherit}
  .answer-option:hover{background:rgba(255,255,255,0.1);border-color:rgba(79,209,197,0.4);transform:translateX(4px)}
  .answer-option.selected{background:rgba(79,209,197,0.12);border-color:#4fd1c5;color:#fff}
  .answer-option.correct{background:rgba(72,187,120,0.18);border-color:#48bb78;color:#fff}
  .answer-option.correct .answer-letter{background:#48bb78;color:#1a1a2e}
  .answer-option.wrong{background:rgba(252,129,129,0.18);border-color:#fc8181;color:#fff}
  .answer-option.wrong .answer-letter{background:#fc8181;color:#1a1a2e}
  .answer-option.disabled{cursor:default;opacity:0.7}
  .answer-option.disabled:hover{transform:none;border-color:rgba(255,255,255,0.08);background:rgba(255,255,255,0.05)}
  .answer-letter{flex-shrink:0;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.1);border-radius:10px;font-weight:700;font-size:15px;color:#fff;transition:all 0.25s}
  .answer-option.selected .answer-letter{background:#4fd1c5;color:#1a1a2e}
  .nav-buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .nav-buttons .btn{flex:1;min-width:140px;max-width:300px}
  .result-card{text-align:center;padding:30px;background:rgba(0,0,0,0.2);border-radius:16px;margin-bottom:24px}
  .score-circle{width:160px;height:160px;border-radius:50%;margin:0 auto 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:6px solid;transition:all 0.5s}
  .score-circle.pass{border-color:#48bb78;background:rgba(72,187,120,0.1)}
  .score-circle.fail{border-color:#fc8181;background:rgba(252,129,129,0.1)}
  .score-number{font-size:42px;font-weight:700;line-height:1}
  .score-circle.pass .score-number{color:#48bb78}
  .score-circle.fail .score-number{color:#fc8181}
  .score-label{font-size:14px;color:#a0aec0;margin-top:6px}
  .result-status{font-size:22px;font-weight:600;margin-bottom:8px}
  .result-status.pass{color:#48bb78}
  .result-status.fail{color:#fc8181}
  .result-detail{color:#a0aec0;font-size:15px;margin-bottom:24px}
  .history-table{width:100%;border-collapse:collapse;margin-top:20px;font-size:14px}
  .history-table th,.history-table td{padding:10px 12px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.08)}
  .history-table th{color:#a0aec0;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:0.5px}
  .history-table td{color:#e0e0e0}
  .history-table tr:hover td{background:rgba(255,255,255,0.03)}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
  .badge-pass{background:rgba(72,187,120,0.15);color:#48bb78}
  .badge-fail{background:rgba(252,129,129,0.15);color:#fc8181}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
  .btn-row .btn{flex:1;min-width:180px}
  .info-box{background:rgba(79,209,197,0.08);border:1px solid rgba(79,209,197,0.2);border-radius:12px;padding:16px;margin-top:16px;font-size:14px;color:#a0aec0;line-height:1.6}
  .info-box strong{color:#4fd1c5}
  .error-msg{color:#fc8181;font-size:14px;margin-top:8px;min-height:20px}
  @media(max-width:600px){
    .container{padding:24px}
    h1{font-size:22px}
    .question-text{font-size:16px;padding:14px}
    .answer-option{padding:12px 14px;font-size:15px}
    .nav-buttons .btn{min-width:100px;font-size:14px;padding:12px 16px}
    .score-circle{width:130px;height:130px}
    .score-number{font-size:34px}
  }
</style>
</head>
<body>
<div class="container">

  <div id="screen-login" class="screen active">
    <div class="lang-switch">
      <button class="lang-btn active" id="lang-ru" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" id="lang-kz" onclick="setLang('kz')">KZ</button>
    </div>
    <h1 data-i18n="title"></h1>
    <h2 data-i18n="subtitle"></h2>
    <div class="login-form">
      <div class="form-group">
        <label for="fio" data-i18n="fioLabel"></label>
        <input type="text" id="fio" autocomplete="name">
      </div>
      <button class="btn btn-primary" onclick="startTest()" data-i18n="startBtn"></button>
    </div>
    <div style="margin-top:30px;text-align:center">
      <button class="btn btn-secondary" onclick="showPasswordPrompt()" data-i18n="journalBtn"></button>
    </div>
  </div>

  <div id="screen-test" class="screen">
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="question-counter" id="question-counter"></div>
    <div class="question-text" id="question-text"></div>
    <div class="answers" id="answers"></div>
    <div class="nav-buttons">
      <button class="btn btn-primary" id="btn-confirm" onclick="confirmAnswer()" disabled data-i18n="confirmBtn"></button>
      <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()" disabled style="display:none"></button>
    </div>
  </div>

  <div id="screen-results" class="screen">
    <h1 data-i18n="resultsTitle"></h1>
    <div class="result-card">
      <div class="score-circle" id="score-circle">
        <div class="score-number" id="score-number">0</div>
        <div class="score-label" data-i18n="scoreLabel"></div>
      </div>
      <div class="result-status" id="result-status"></div>
      <div class="result-detail" id="result-detail"></div>
    </div>
    <div class="info-box" data-i18n="infoBox"></div>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="restartTest()" data-i18n="restartBtn"></button>
      <button class="btn btn-secondary" onclick="showPasswordPrompt()" data-i18n="journalBtn2"></button>
    </div>
  </div>

  <div id="screen-password" class="screen">
    <h1 data-i18n="journalTitle"></h1>
    <h2 data-i18n="journalSubtitle"></h2>
    <div class="login-form">
      <div class="form-group">
        <label for="password" data-i18n="passwordLabel"></label>
        <input type="password" id="password">
        <div class="error-msg" id="password-error"></div>
      </div>
      <button class="btn btn-primary" onclick="checkPassword()" data-i18n="loginBtn"></button>
    </div>
    <div style="margin-top:20px;text-align:center">
      <button class="btn btn-secondary" onclick="goToLogin()" data-i18n="backBtn"></button>
    </div>
  </div>

  <div id="screen-history" class="screen">
    <h1 data-i18n="journalTitle2"></h1>
    <h2 data-i18n="journalSubtitle2"></h2>
    <div id="history-content"></div>
    <div class="btn-row" style="margin-top:24px">
      <button class="btn btn-primary" onclick="downloadResults()" data-i18n="downloadAllBtn"></button>
      <button class="btn btn-secondary" onclick="goToLogin()" data-i18n="homeBtn"></button>
    </div>
  </div>

</div>

<script>
const ALL_QUESTIONS=[{"id": 1, "question": "За счёт кого финансируются мероприятия по безопасности и охране труда?", "answers": [{"letter": "А", "text": "Работников — из их заработной платы"}, {"letter": "Б", "text": "Работодателя и других не запрещённых законом источников"}, {"letter": "В", "text": "Только государственного бюджета"}, {"letter": "Г", "text": "Работников и работодателя поровну"}], "correct": "Б"}, {"id": 2, "question": "Как часто проводится аттестация производственных объектов по условиям труда?", "answers": [{"letter": "А", "text": "Ежегодно"}, {"letter": "Б", "text": "Один раз в 2 года"}, {"letter": "В", "text": "Один раз в 3 года"}, {"letter": "Г", "text": "Не реже одного раза в 5 лет"}], "correct": "Г"}, {"id": 3, "question": "Как часто руководители и лица, ответственные за БиОТ, проходят обучение и проверку знаний?", "answers": [{"letter": "А", "text": "Не реже одного раза в 3 года"}, {"letter": "Б", "text": "Не реже одного раза в 5 лет"}, {"letter": "В", "text": "Один раз при назначении"}, {"letter": "Г", "text": "Ежеквартально"}], "correct": "А"}, {"id": 4, "question": "Что обязательно при отказе работника от работы из-за угрозы жизни или отсутствия СИЗ?", "answers": [{"letter": "А", "text": "Устно предупредить коллег"}, {"letter": "Б", "text": "Получить разрешение профсоюза"}, {"letter": "В", "text": "Письменно известить непосредственного руководителя или работодателя"}, {"letter": "Г", "text": "Сообщить после окончания смены"}], "correct": "В"}, {"id": 5, "question": "В какой срок работодатель сообщает о несчастном случае в территориальное подразделение?", "answers": [{"letter": "А", "text": "Немедленно, в течение суток"}, {"letter": "Б", "text": "В течение 3 рабочих дней"}, {"letter": "В", "text": "В течение 10 дней"}, {"letter": "Г", "text": "После окончания расследования"}], "correct": "А"}, {"id": 6, "question": "В какой срок работодатель уведомляет страховую организацию о несчастном случае?", "answers": [{"letter": "А", "text": "В течение 24 часов"}, {"letter": "Б", "text": "Не позднее 3 рабочих дней"}, {"letter": "В", "text": "В течение 10 рабочих дней"}, {"letter": "Г", "text": "В течение месяца"}], "correct": "Б"}, {"id": 7, "question": "Кто возглавляет комиссию по специальному расследованию несчастного случая?", "answers": [{"letter": "А", "text": "Руководитель организации"}, {"letter": "Б", "text": "Представитель работников"}, {"letter": "В", "text": "Представитель страховой организации"}, {"letter": "Г", "text": "Государственный инспектор труда"}], "correct": "Г"}, {"id": 8, "question": "Какой срок расследования несчастного случая установлен без учёта продлений?", "answers": [{"letter": "А", "text": "3 рабочих дня"}, {"letter": "Б", "text": "5 рабочих дней"}, {"letter": "В", "text": "10 рабочих дней"}, {"letter": "Г", "text": "30 календарных дней"}], "correct": "В"}, {"id": 9, "question": "Какую максимальную степень вины пострадавшего может установить комиссия при его грубой неосторожности?", "answers": [{"letter": "А", "text": "10%"}, {"letter": "Б", "text": "25%"}, {"letter": "В", "text": "50%"}, {"letter": "Г", "text": "75%"}], "correct": "Б"}, {"id": 10, "question": "Сколько лет работодатель хранит материалы расследования несчастного случая?", "answers": [{"letter": "А", "text": "5 лет"}, {"letter": "Б", "text": "10 лет"}, {"letter": "В", "text": "25 лет"}, {"letter": "Г", "text": "45 лет"}], "correct": "Г"}, {"id": 11, "question": "Кто НЕ включается в состав комиссии по расследованию несчастного случая?", "answers": [{"letter": "А", "text": "Должностное лицо, отвечающее за безопасность на участке происшествия"}, {"letter": "Б", "text": "Руководитель службы безопасности и охраны труда"}, {"letter": "В", "text": "Представитель работников"}, {"letter": "Г", "text": "Заместитель руководителя организации"}], "correct": "А"}, {"id": 12, "question": "На какой срок госинспектор труда может приостановить работу участка или оборудования?", "answers": [{"letter": "А", "text": "До 1 рабочего дня бе ALL_QUESTIONS.forEach((q,i)=>{q.__idx=i});

function setLang(lang){
  currentLang=lang;
  document.getElementById('lang-ru').classList.toggle('active',lang==='ru');
  document.getElementById('lang-kz').classList.toggle('active',lang==='kz');
  applyLang();
}

function applyLang(){
  const t=LANG[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key=el.dataset.i18n;
    if(typeof t[key]==='string')el.innerHTML=t[key];
  });
  document.getElementById('fio').placeholder=t.fioPlaceholder;
  document.getElementById('password').placeholder=t.passwordPlaceholder;
  if(document.getElementById('screen-test').classList.contains('active')&&shuffledQuestions.length){
    renderQuestion();
  }
}

function shuffleArray(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('password-error').textContent='';document.getElementById('password').value=''}

function startTest(){
  const fio=document.getElementById('fio').value.trim();
  if(!fio){alert(LANG[currentLang].fioAlert);return}
  userFIO=fio;
  shuffledQuestions=shuffleArray(ALL_QUESTIONS);
  userAnswers=new Array(shuffledQuestions.length).fill(null);
  currentIndex=0;
  showScreen('screen-test');
  renderQuestion();
}

function renderQuestion(){
  const qRu=shuffledQuestions[currentIndex];
  const q=currentLang==='kz'?(ALL_QUESTIONS_KZ[qRu.__idx]||qRu):qRu;
  const t=LANG[currentLang];
  document.getElementById('question-counter').textContent=t.questionCounter(currentIndex+1,shuffledQuestions.length);
  document.getElementById('question-text').textContent=q.question;
  document.getElementById('progress-fill').style.width=((currentIndex)/shuffledQuestions.length*100)+'%';
  const answersDiv=document.getElementById('answers');
  answersDiv.innerHTML='';
  q.answers.forEach((ans)=>{
    const btn=document.createElement('button');
    btn.className='answer-option';
    btn.dataset.letter=ans.letter;
    btn.innerHTML='<span class="answer-letter">'+ans.letter+'</span><span>'+escapeHtml(ans.text)+'</span>';
    btn.onclick=()=>selectAnswer(ans.letter);
    answersDiv.appendChild(btn);
  });
  document.getElementById('btn-confirm').disabled=true;
  document.getElementById('btn-confirm').style.display='';
  document.getElementById('btn-confirm').textContent=t.confirmBtn;
  document.getElementById('btn-next').disabled=true;
  document.getElementById('btn-next').style.display='none';
  document.getElementById('btn-next').textContent=currentIndex===shuffledQuestions.length-1?t.finishBtn:t.nextBtn;
}

function escapeHtml(text){const div=document.createElement('div');div.textContent=text;return div.innerHTML}

function selectAnswer(letter){
  userAnswers[currentIndex]=letter;
  const buttons=document.querySelectorAll('.answer-option');
  buttons.forEach(btn=>{
    btn.classList.toggle('selected', btn.dataset.letter===letter);
  });
  document.getElementById('btn-confirm').disabled=false;
}

function confirmAnswer(){
  const letter=userAnswers[currentIndex];
  if(!letter)return;
  const q=shuffledQuestions[currentIndex];
  const correctLetter=q.correct;
  const buttons=document.querySelectorAll('.answer-option');
  buttons.forEach(btn=>{
    btn.onclick=null;
    btn.classList.add('disabled');
    const btnLetter=btn.dataset.letter;
    if(btnLetter===letter && btnLetter===correctLetter){
      btn.classList.add('correct');
    }else if(btnLetter===letter && btnLetter!==correctLetter){
      btn.classList.add('wrong');
    }else if(btnLetter===correctLetter){
      btn.classList.add('correct');
    }
  });
  document.getElementById('btn-confirm').style.display='none';
  document.getElementById('btn-next').style.display='';
  document.getElementById('btn-next').disabled=false;
}

function nextQuestion(){
  if(currentIndex<shuffledQuestions.length-1){currentIndex++;renderQuestion()}
  else{finishTest()}
}

function finishTest(){
  let correctCount=0;
  for(let i=0;i<shuffledQuestions.length;i++){if(userAnswers[i]===shuffledQuestions[i].correct)correctCount++}
  const percent=Math.round((correctCount/shuffledQuestions.length)*100);
  const passed=percent>=70;
  const resultObj={date:new Date().toLocaleString('ru-RU'),fio:userFIO,score:correctCount,total:shuffledQuestions.length,percent:percent,passed:passed};
  const results=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
  results.push(resultObj);
  localStorage.setItem(LS_KEY,JSON.stringify(results));
  downloadSingleResult(resultObj);
  const circle=document.getElementById('score-circle');
  circle.className='score-circle '+(passed?'pass':'fail');
  document.getElementById('score-number').textContent=correctCount;
  const t=LANG[currentLang];
  document.getElementById('result-status').textContent=passed?t.passed:t.failed;
  document.getElementById('result-status').className='result-status '+(passed?'pass':'fail');
  document.getElementById('result-detail').textContent=t.resultDetail(correctCount,shuffledQuestions.length,percent);
  showScreen('screen-results');
}

function downloadSingleResult(result){
  const status=result.passed?"Пройден":"Не пройден";
  const csv='\uFEFFДата;ФИО;Правильно;Всего;Процент;Статус\n'+result.date+';"'+result.fio+'";'+result.score+';'+result.total+';'+result.percent+'%;'+status+'\n';
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  const safeFio=result.fio.replace(/[^\w\s\-]/g,'').replace(/\s+/g,'_');
  a.download='biot_result_'+safeFio+'_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function downloadResults(){
  const results=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
  if(results.length===0){alert(LANG[currentLang].noSavedResults);return}
  let csv='\uFEFFДата;ФИО;Правильно;Всего;Процент;Статус\n';
  results.forEach(r=>{const status=r.passed?"Пройден":"Не пройден";csv+=r.date+';"'+r.fio+'";'+r.score+';'+r.total+';'+r.percent+'%;'+status+'\n'});
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='biot_all_results.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function restartTest(){document.getElementById('fio').value=userFIO;showScreen('screen-login')}
function goToLogin(){showScreen('screen-login')}
function showPasswordPrompt(){showScreen('screen-password')}

function checkPassword(){
  const pwd=document.getElementById('password').value;
  if(pwd===TEACHER_PASSWORD){showAllResults()}
  else{document.getElementById('password-error').textContent=LANG[currentLang].wrongPassword}
}

function showAllResults(){
  const results=JSON.parse(localStorage.getItem(LS_KEY)||'[]');
  const container=document.getElementById('history-content');
  const t=LANG[currentLang];
  if(results.length===0){container.innerHTML='<p style="text-align:center;color:#a0aec0;margin-top:20px">'+t.noResults+'</p>'}
  else{
    let html='<table class="history-table"><thead><tr><th>'+t.thDate+'</th><th>'+t.thFio+'</th><th>'+t.thScore+'</th><th>'+t.thPercent+'</th><th>'+t.thStatus+'</th></tr></thead><tbody>';
    results.slice().reverse().forEach(r=>{
      const badge=r.passed?'<span class="badge badge-pass">'+t.statusPassed+'</span>':'<span class="badge badge-fail">'+t.statusFailed+'</span>';
      html+='<tr><td>'+r.date+'</td><td>'+escapeHtml(r.fio)+'</td><td>'+r.score+'/'+r.total+'</td><td>'+r.percent+'%</td><td>'+badge+'</td></tr>';
    });
    html+='</tbody></table>';
    container.innerHTML=html;
  }
  showScreen('screen-history');
}

document.getElementById('fio').addEventListener('keypress',function(e){if(e.key==='Enter')startTest()});
document.getElementById('password').addEventListener('keypress',function(e){if(e.key==='Enter')checkPassword()});
applyLang();
